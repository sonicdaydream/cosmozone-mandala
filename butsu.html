<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>コスモゾーン・尊像 — 無限入れ子曼荼羅</title>
<meta name="description" content="五智如来の坐像が幾重にも入れ子になった、無限に潜れる曼荼羅。指でなぞって奥へ潜る、音と映像が連動したジェネラティブ・アート。">
<link rel="canonical" href="https://cosmozone-mandala.vercel.app/butsu">
<link rel="alternate" hreflang="ja" href="https://cosmozone-mandala.vercel.app/butsu">

<meta property="og:type" content="website">
<meta property="og:site_name" content="コスモゾーン">
<meta property="og:title" content="コスモゾーン・尊像 — 無限入れ子曼荼羅">
<meta property="og:description" content="五智如来の坐像が幾重にも入れ子になった、無限に潜れる曼荼羅。">
<meta property="og:image" content="https://cosmozone-mandala.vercel.app/og.png">
<meta property="og:url" content="https://cosmozone-mandala.vercel.app/butsu">
<meta name="twitter:card" content="summary_large_image">

<link rel="stylesheet" href="/css/mandala.css">
</head>
<body>
<canvas id="c"></canvas>

<div id="ladder"><div id="ladderInner"><div class="rail"></div><div id="marker"></div></div></div>

<div id="hud">
  <div class="val" id="scaleVal">1.0 × 10⁰ m</div>
  <div class="name" id="scaleName">人の背丈</div>
  <div class="layer" id="layerNo">第 0 層</div>
</div>

<div id="hint">画面を時計回りになぞると潜る　反時計回りで浮上</div>

<button id="btnNames">尊名</button>
<nav id="verNav" aria-label="バージョン切り替え">
  <a href="/" data-m="abstract">抽象</a>
  <a href="/bonji" data-m="bonji">梵字</a>
  <a href="/butsu" data-m="butsu">尊像</a>
</nav>
<div id="legend" hidden>
  <h2>五智如来</h2>
  <ul id="legendList"></ul>
  <p id="fontNote"></p>
</div>

<div id="recordPanel" hidden>
  <button id="btnShareLink">リンクを共有</button>
  <button id="btnRec15">15秒録画</button>
  <button id="btnSaveImg">画像を保存</button>
  <div id="recordStatus" aria-live="polite"></div>
</div>

<div id="bar">
  <button id="btnPlay">停止</button>
  <button id="btnDir">外へ</button>
  <button id="btnSound">音を出す</button>
  <button id="btnSeed">別の曼荼羅</button>
  <button id="btnRecord">記録</button>
  <div id="speedWrap"><span>速さ</span><input type="range" id="speed" min="4" max="80" value="29"></div>
</div>

<script>window.MANDALA_CONFIG = { mode: 'butsu' };</script>
<script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
<script defer src="/_vercel/insights/script.js"></script>
<script defer src="/_vercel/speed-insights/script.js"></script>
<script src="/js/mandala.js"></script>
</body>
</html>
